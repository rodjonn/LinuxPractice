network:
  ethernets:
    enp0s3:
      # Bridge adapter — access from host machine
      dhcp4: true
    enp0s8:
      # Internal network "servernet" — gateway side facing VM A
      dhcp4: no
      addresses: [192.168.13.1/24]
    enp0s9:
      # Internal network "clientnet" — gateway side facing VM C
      dhcp4: no
      addresses: [192.168.8.1/24]
  version: 2
